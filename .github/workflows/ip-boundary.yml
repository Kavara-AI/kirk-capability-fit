name: IP boundary (§8)

# A real, satisfiable gate for a repo with one writer. A required-review rule cannot be
# met by a single person — GitHub does not permit self-approval — so it protects nothing
# and can only be cleared by admin override. This can actually pass or fail.
on:
  pull_request:
    paths: ["SKILL.md", "README.md", "tools/check_ip_boundary.py"]
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN. The only job checks out the repo and scans
# SKILL.md on disk; it does not push, comment, cache, or call the GitHub API,
# so it keeps this grant and does not elevate at job level.
permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check §8 IP boundary
        run: python3 tools/check_ip_boundary.py
